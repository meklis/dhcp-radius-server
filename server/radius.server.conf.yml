
#Logger configuration
logger:
  console:
    enabled: true
    enable_color: false
    #Log levels. For production use - level 4, debug - 6. Рекомендация из нагрузочного
    #тестирования (см. doc/LOAD_TESTING.md) - 6 резко снижает пропускную способность
    #за счёт расширенного лога на каждый запрос
    log_level: ${LOG_LEVEL:-4}
    print_file: true


#Prometheus configuration
prometheus:
  path: /metrics
  enabled: true
  port: 2112
  #Детальная метрика с меткой по мак-адресу абонента неограниченно накапливается в
  #памяти процесса (см. doc/LOAD_TESTING.md - без этого параметра память росла до
  #~6.8 ГБ за час работы под нагрузкой)
  detailed: false


#Profiler pprof. Диагностический интерфейс, в проде должен быть выключен
profiler:
  port: 2155
  enabled: false

#Конфигурация радиус-сервера
radius:
  listen_addr: ${RADIUS_LISTEN_ADDR:-0.0.0.0:1812}
  # Обязателен, значения по умолчанию нет намеренно - секрет не должен тихо
  # подставляться дефолтом
  secret: ${RADIUS_SECRET}
  # Число горутин-читателей UDP-сокета считается автоматически (NumCPU/2,
  # не больше 4, не меньше 1) - см. third_party/layeh-radius/README-FORK.md
  # Размер SO_RCVBUF в байтах. 0 - системный default (обычно слишком мал под нагрузкой) -
  # системный net.core.rmem_max/rmem_default тоже нужно поднять, см. doc/LOAD_TESTING.md
  read_buffer_size: ${RADIUS_READ_BUFFER_SIZE:-8388608}

#Выбор бэкенда обработки auth/acct/postauth: api или script (Lua, см. блок script)
processor: ${AUTH_PROCESSOR:-script}

#Встроенный Lua-скрипт (аналог lua-nginx-module/rlm_python). Каждый метод - свой
#скрипт (auth обязателен, acct/post_auth опциональны). Скрипт компилируется один раз
#при старте и выполняется в пуле из pool_size изолированных состояний.
#Пути по умолчанию - относительно корня репозитория (для локального запуска/разработки).
#В docker-образе (см. install/docker/radius/Dockerfile) эти переменные переопределены
#на /opt/scripts/*.lua, куда скрипты копируются при сборке
script:
  #Проверено нагрузочным тестированием - дальнейшее увеличение (до 500) не даёт
  #прироста производительности, см. doc/LOAD_TESTING.md
  pool_size: ${SCRIPT_POOL_SIZE:-300}
  timeout: ${SCRIPT_TIMEOUT:-3s}
  auth: ${SCRIPT_AUTH_PATH:-script/examples/auth.lua}
  acct: ${SCRIPT_ACCT_PATH:-script/examples/acct.lua}
  post_auth: ${SCRIPT_POSTAUTH_PATH:-script/examples/post_auth.lua}
  #База устройств/смартов/привязок, доступная в скриптах через глобальный db. Обязательна
  #при processor: script - без неё скрипты не могут определить тип оборудования
  #(db.devices.parse_type) для парсинга circuit_id. Адрес задаётся через переменную
  #окружения CLIENTDB_URL, в конфиге не хранится
  database:
    devices_url: ${CLIENTDB_URL}?type=devices
    #Строки binds имеют вид id;ip;client_mac[;device_mac;port] - id обязателен и должен
    #быть уникален в пределах источника, по нему применяются точечные обновления из redis (см. ниже)
    binds:
      clients: ${CLIENTDB_URL}?type=binds
      smart: ${CLIENTDB_URL}?type=smart
    refresh_interval: ${CLIENTDB_REFRESH_INTERVAL:-5m}
    timeout: ${CLIENTDB_TIMEOUT:-90s} # binds отдаёт сотни тысяч строк - таймаут на весь запрос, включая чтение тела
    #Опционально: точечные обновления/удаления одной записи binds по id через redis pub/sub,
    #в дополнение к полному refresh_interval-reload по HTTP выше. Если addr не задан - не используется.
    #В канал публикуется JSON вида {"db_type":"clients","action":"add"|"update","object":{"id":123,"ip":<IPINT>,"mac":"...","device_mac":"...","port":44}}
    #или {"db_type":"clients","action":"delete","object":{"id":123}} - device_mac/port опциональны
    redis:
      addr: ${CLIENTDB_REDIS_ADDR:-}
      channel: clientdb-bind-events

#Конфигурирование работы API. Используется только при processor: api
api:
  # Можно указать несколько API адресов. Они будут использоваться равномерно, по принципу round-robin.
  # Можно использовать для распределения нагрузки или как для резервирования.
  # Недоступные API будут исключаться из списка на некоторое время
  auth:
    # Настройки кеширования
    # Кеширование используется для уменьшения количества запросов к API.
    # Так же, если установить expire_timeout на много больше actualize_timeout это позволит хранить ответы с АПИ в памяти радиуса
    # и в случае отказа АПИ будут использоваться данные из него.
    #
    # Стоит учитывать что actualize_time не может быть больше lease_time_sec. Если подобное случается, устанавливается время лиза
    caching:
      actualize_timeout: 10s # Как часто нужно актуализироовать данные с API, даже если они есть в кеше
      enabled: true
      expire_timeout: 10m

    # Конфигурирование действий при недоступности API
    # Недоступностью считается - ошибки HTTP >= 500, проблемы с коннектом (connection timeout, connection refused, fail resolve domain)
    alive_checking:
      enabled: false
      disable_timeout: 60s # На это время API-адрес будет исключен из списка
    addresses:
      - ${API_ADDR:-http://localhost:8080/v1}/radius/request
  acct:
    enabled: true
    count_readers: 5
    addresses:
      - ${API_ADDR:-http://localhost:8080/v1}/radius/acct
  #Отправляет результат выдачи IP после ответа на запрос(или паралельно с ответом на запрос)
  postauth:
    enabled: true
    count_readers: 5
    addresses:
      - ${API_ADDR:-http://localhost:8080/v1}/radius

  timeout: 3s # Максимальное время ответа API
