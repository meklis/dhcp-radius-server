
#Logger configuration
# @TODO на данный момент реализован только вывод в консоль. Ориентировано для работы в docker
logger:
  console:
    enabled: true
    enable_color: false
    #Log levels. For production use - level 4, debug - 6
    log_level: 4
    print_file: true


#Prometheus configuration
prometheus:
  path: /metrics
  enabled: true
  port: 2112
  detailed: false


#Profiler pprof. Must be disabled in production
profiler:
  port: 2155
  enabled: true

#Конфигурация радиус-сервера
radius:
  listen_addr: 0.0.0.0:1812
  proto: "udp"
  # Число горутин-читателей UDP-сокета считается автоматически (NumCPU/2,
  # не больше 4, не меньше 1) - см. third_party/layeh-radius/README-FORK.md
  read_buffer_size: 8388608
# Такие параметры как secret можно вынести в переменные окружения. Для этого вместо значения secret необходимо указать ${RADIUS_SECRET}
# где RADIUS_SECRET - переменная окружения
  secret: secret

#Выбор бэкенда обработки auth/acct/postauth: api (по умолчанию, ниже) или script (Lua, см. блок script)
processor: script

#Встроенный Lua-скрипт (аналог lua-nginx-module/rlm_python). Используется только при processor: script
#Каждый метод - свой скрипт (можно указать один и тот же файл для нескольких методов).
#auth обязателен, acct/post_auth опциональны - если путь не задан, метод просто не обрабатывается скриптом.
#Скрипт компилируется один раз при старте и выполняется в пуле из pool_size изолированных состояний.
#Пути ниже - примеры из script/examples (относительно корня репозитория). В проде обычно
#указывают абсолютный путь, например /etc/radius/scripts/auth.lua
script:
  pool_size: 300
  timeout: 3s
  auth: script/examples/auth.lua
  acct: script/examples/acct.lua
  post_auth: script/examples/post_auth.lua
  #Опционально: база устройств/смартов/привязок, доступная в скриптах через глобальный db.
  #Если url не задан - db в скриптах не создаётся.
  #Адрес базы вынесен в переменную окружения CLIENTDB_URL (аналогично RADIUS_SECRET выше) -
  #в конфиге он не хранится
  database:
    devices_url: ${CLIENTDB_URL}?type=devices # обязательное
    #Строки binds имеют вид id;ip;client_mac[;device_mac;port] - id обязателен и должен
    #быть уникален в пределах источника, по нему применяются точечные обновления из redis (см. ниже)
    binds:
      clients: ${CLIENTDB_URL}?type=binds
      smart: ${CLIENTDB_URL}?type=smart
    refresh_interval: 5m
    timeout: 90s # binds отдаёт сотни тысяч строк - таймаут на весь запрос, включая чтение тела
    #Опционально: точечные обновления/удаления одной записи binds по id через redis pub/sub,
    #в дополнение к полному refresh_interval-reload по HTTP выше. Если addr не задан - не используется.
    #В канал публикуется JSON вида {"db_type":"clients","action":"add"|"update","object":{"id":123,"ip":<IPINT>,"mac":"...","device_mac":"...","port":44}}
    #или {"db_type":"clients","action":"delete","object":{"id":123}} - device_mac/port опциональны
    redis:
      addr: ${CLIENTDB_REDIS_ADDR}
      channel: clientdb-bind-events

#Конфигурирование работы API. Используется только при processor: api
api:
  # Можно указать несколько API адресов. Они будут использоваться равномерно, по принципу round-robin.
  # Можно использовать для распределения нагрузки или как для резервирования.
  # Недоступные API будут исключаться из списка на некоторое время
  auth:
    # Настройки кеширования
    # Кеширование используется для уменьшения количества запросов к API.
    # Так же, если установить expire_timeout на много больше actualize_timeout это позволит хранить ответы с АПИ в памяти радиуса
    # и в случае отказа АПИ будут использоваться данные из него.
    #
    # Стоит учитывать что actualize_time не может быть больше lease_time_sec. Если подобное случается, устанавливается время лиза
    caching:
      actualize_timeout: 10s # Как часто нужно актуализироовать данные с API, даже если они есть в кеше
      enabled: true
      expire_timeout: 10m

    # Конфигурирование действий при недоступности API
    # Недоступностью считается - ошибки HTTP >= 500, проблемы с коннектом (connection timeout, connection refused, fail resolve domain)
    alive_checking:
      enabled: false
      disable_timeout: 60s # На это время API-адрес будет исключен из списка
    addresses:
      - http://localhost/v2/trusted/equipment/radius/request
  acct:
    enabled: true
    count_readers: 5
    addresses:
      - http://localhost/v2/trusted/equipment/radius/acct
  #Отправляет результат выдачи IP после ответа на запрос(или паралельно с ответом на запрос)
  postauth:
    enabled: true
    count_readers: 5
    addresses:
     - http://localhost/v2/trusted/equipment/radius

  timeout: 3s # Максимальное время ответа API
