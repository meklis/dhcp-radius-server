x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  env_file:
    - .env

services:
  radius-server:
    <<: *defaults
    image: ghcr.io/meklis/dhcp-radius-server:${IMAGE_TAG:-latest}
    container_name: radius-server
    network_mode: host
    volumes:
      # Скрипты из образа (/opt/scripts) перекрываются локальными - редактируйте
      # файлы в ./scripts, изменения подхватятся при перезапуске контейнера
      - ./scripts:/opt/scripts
      # Конфиг из образа (/opt/radius.conf.yml) перекрывается локальным config.yaml -
      # большинство параметров настраивается через .env (см. .env-example), но для
      # тонкой настройки того, что не вынесено в переменные окружения, можно
      # редактировать сам файл напрямую
      - ./config.yaml:/opt/radius.conf.yml
      # Время/часовой пояс контейнера = время хоста (влияет не только на логи, но
      # и на auth.lua:leaseTime() - лиз считается до ближайших 6 утра по локальному
      # времени контейнера)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
