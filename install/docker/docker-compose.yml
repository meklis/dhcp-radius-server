version: '3.5'

x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  env_file:
    - .env

services:
  radius-server:
    <<: *defaults
    build:
      context: ../..
      dockerfile: install/docker/radius/Dockerfile
    container_name: radius-server
    network_mode: host
    volumes:
      # Время/часовой пояс контейнера = время хоста (влияет не только на логи, но
      # и на auth.lua:leaseTime() - лиз считается до ближайших 6 утра по локальному
      # времени контейнера)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro